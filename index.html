<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH_Tube</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        .active{
            background: #FF1F3D;
            color: white;
        }
    </style>
</head>

<body>
    <!-- Header Area------------------- -->

    <header>
        <nav class="w-11/12 mx-auto flex justify-between items-center border-b-2 py-5 border-[#17171720]">
            <div class="logo">
                <img class="w-[120px]" src="./Resources/Logo.png" alt="">
            </div>
            <div class="sort">
                <button class="btn bg-[#25252520]">Sort By View</button>
            </div>
            <div class="blogs">
                <button class="btn bg-[rgb(255,31,61)] text-white">Blogs</button>
            </div>
        </nav>
    </header>
    <!-- ########################################## -->


    <!-- Category Button Area ----------------- -->

    <nav id="category-container" class="flex py-2 justify-center gap-5">
        <button id="btn-all" onclick="loadVideos()" class="btn btn-sm">ALL</button>
    </nav>
    <!-- ########################################## -->


    <!-- Video Container Area --------------- -->

    <section id="video-container" class="w-11/12 mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">

        <div class="col-span-full flex flex-col text-center justify-center items-center py-20">
            <img class="w-[120px]" src="Resources/Icon.png" alt="">
            <h2 class="text-2xl font-bold">Oops!! Sorry, There is no content here</h2>
        </div>

    </section>
    <!-- ########################################## -->

    <script src="script/index.js"></script>
</body>

</html>
